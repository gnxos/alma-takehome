services:
  mailpit:
    image: axllent/mailpit:v1.30.6
    ports:
      - "8025:8025" # web UI — view caught mail at http://localhost:8025
      - "1025:1025" # SMTP
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8025/readyz"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 3s

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: sqlite:////app/data/leads.db
      UPLOAD_DIR: /app/uploads
      CORS_ORIGINS: http://localhost:3000
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-Alma <onboarding@alma.example.com>}
      ATTORNEY_EMAIL: ${ATTORNEY_EMAIL:-attorney@alma.example.com}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      EMAIL_BACKEND: ${EMAIL_BACKEND:-smtp}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
    volumes:
      - backend_data:/app/data
      - backend_uploads:/app/uploads
    depends_on:
      mailpit:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 3s

  frontend:
    build:
      context: ./frontend
      args:
        # Runs in the browser, so it must point at a host-reachable URL,
        # not the Docker-internal "backend" service name.
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  backend_data:
  backend_uploads:
